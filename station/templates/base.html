{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ЖД-Станция{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'station/css/style.css' %}">
</head>
<body>
    
<header>
    <div class="container header-content">

        <a href="{% url 'home' %}" class="logo">
            ЖД-Станция
        </a>

        <nav>
            <ul class="nav-list">

                <li>
                    <a href="{% url 'home' %}">Главная</a>
                </li>

                <li class="dropdown">
                    <a href="{% url 'about' %}">О компании</a>

                    <div class="dropdown-menu">
                        <a href="{% url 'contacts' %}">Контакты</a>
                        <a href="{% url 'location' %}">Как нас найти</a>
                    </div>
                </li>

                <li>
                    <a href="{% url 'schedule' %}">Расписание</a>
                </li>

                <li>
                    <a href="{% url 'services' %}">Услуги</a>
                </li>

            </ul>
        </nav>

    </div>
</header>

<main class="container content">

    {% block content %}
    {% endblock %}

</main>

<footer>
    <div class="container">
        <p>2026 ЖД-Станция. Железнодорожная пассажирская станция.</p>
    </div>
</footer>

</body>
</html>
