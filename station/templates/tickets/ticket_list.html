
{% extends 'base.html' %}

{% block content %}
<h1>Список билетов</h1>

<a href="{% url 'ticket_create' %}">Добавить билет</a>

<ul>
    {% for ticket in tickets %}
        <li>
            <a href="{% url 'ticket_detail' ticket.pk %}">
                Билет №{{ ticket.pk }}
            </a>

            <a href="{% url 'ticket_update' ticket.pk %}">Редактировать</a>

            <a href="{% url 'ticket_delete' ticket.pk %}">Удалить</a>
        </li>
    {% empty %}
        <li>Список билетов пока пуст.</li>
    {% endfor %}
</ul>
{% endblock %}
