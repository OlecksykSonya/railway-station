
{% extends 'base.html' %}

{% block content %}
{% if object %}
    <h1>Редактирование билета</h1>
{% else %}
    <h1>Добавление нового билета</h1>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'ticket_list' %}">Вернуться к списку билетов</a>
{% endblock %}
