
{% extends 'base.html' %}

{% block content %}
{% if object %}
    <h1>Редактирование данных пассажира</h1>
{% else %}
    <h1>Добавление нового пассажира</h1>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'passenger_list' %}">Вернуться к списку пассажиров</a>
{% endblock %}
