
{% extends 'base.html' %}

{% block content %}

<p>Вы действительно хотите удалить пассажира {{ object.full_name }}?</p>

<form method="post">

</form>

<a href="{% url 'passenger_list' %}">Отмена</a>
{% endblock %}
