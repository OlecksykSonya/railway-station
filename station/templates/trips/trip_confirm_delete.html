
{% extends 'base.html' %}

{% block content %}
<h1>Удаление рейса</h1>

<p>Вы действительно хотите удалить выбранный рейс?</p>

<p>Поезд: {{ object.train }}</p>
<p>Маршрут: {{ object.route }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
</form>

<a href="{% url 'trip_list' %}">Отмена</a>
{% endblock %}
