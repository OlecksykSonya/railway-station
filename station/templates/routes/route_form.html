
{% extends 'base.html' %}

{% block content %}
{% if object %}
    <h1>Редактирование маршрута</h1>
{% else %}
    <h1>Добавление нового маршрута</h1>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'route_list' %}">Вернуться к списку маршрутов</a>
{% endblock %}
