
{% extends 'base.html' %}

{% block content %}
{% if object %}
    <h1>Редактирование поезда</h1>
{% else %}
    <h1>Добавление нового поезда</h1>
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'train_list' %}">Вернуться к списку поездов</a>
{% endblock %}
